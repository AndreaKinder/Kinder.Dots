[terminal]
shell = "/bin/bash"

[window]
decorations = "None"
padding = { x = 8, y = 8 }

[font]
size = 10.0
normal = { family = "MesloLGL Nerd Font Mono", style = "Regular" }
bold = { family = "MesloLGL Nerd Font Mono", style = "Bold" }
italic = { family = "MesloLGL Nerd Font Mono", style = "Italic" }

[colors.primary]
background = "#000000"
foreground = "#e6e6e6"

[colors.cursor]
text = "#000000"
cursor = "#ffffff"

[colors.selection]
text = "#000000"
background = "#e6e6e6"

[colors.normal]
black = "#000000"
red = "#e06c75"
green = "#98c379"
yellow = "#e5c07b"
blue = "#d946ef"
magenta = "#c678dd"
cyan = "#56b6c2"
white = "#d0d0d0"

[colors.bright]
black = "#555555"
red = "#ff7a85"
green = "#b5e890"
yellow = "#f5d08a"
blue = "#f0abfc"
magenta = "#dda0f0"
cyan = "#76d6e2"
white = "#ffffff"

[[keyboard.bindings]]
key = "C"
mods = "Super"
action = "Copy"

[[keyboard.bindings]]
key = "X"
mods = "Super"
action = "Copy"

[[keyboard.bindings]]
key = "V"
mods = "Super"
action = "Paste"

[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
action = "Copy"

[[keyboard.bindings]]
key = "V"
mods = "Control|Shift"
action = "Paste"
