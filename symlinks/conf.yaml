- clean: ['~']

- defaults:
    link:
      create: true
      force: true

- create:
    - $DOTFILES_PATH/shell/bash/completions
    - $DOTFILES_PATH/shell/bash/themes
    - ~/Work
    - ~/Proyectos
    - ~/Notas
    - ~/Notas/inbox
    - ~/Notas/journal
    - ~/Notas/projects
    - ~/Notas/templates
    - ~/Notas/zettelkasten
    - ~/Imágenes/Wallpapers
    - ~/Imágenes/Profiles
    - ~/Imágenes/Capturas

- link:
    ~/.bash_profile: shell/bash/.bash_profile
    ~/.bashrc: shell/bash/.bashrc
    ~/.zimrc: shell/zsh/.zimrc
    ~/.zlogin: shell/zsh/.zlogin
    ~/.zshenv: shell/zsh/.zshenv
    ~/.zshrc: shell/zsh/.zshrc
    ~/.inputrc: shell/.inputrc
    ~/.gitconfig: git/.gitconfig
    ~/.config/gh/config.yml: git/gh/config.yml
    ~/.config/nvim: editors/nvim
    ~/.config/micro: editors/micro
    ~/.config/lazygit/config.yml: editors/lazygit/config.yml
    ~/.config/fish/config.fish: shell/fish/config.fish
    ~/.config/fish/fish_plugins: shell/fish/fish_plugins
    ~/.config/fish/conf.d: shell/fish/conf.d
    ~/.config/fish/functions: shell/fish/functions
    ~/.config/fish/completions: shell/fish/completions
    ~/.agents: ai/agents
    ~/.gemini/config/skills: ai/agents/skills
    ~/.gemini/config/mcp_config.json: ai/agents/mcp/mcp_config.json
